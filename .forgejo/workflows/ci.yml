name: CI

# Canonical CI for BadTerm, on the Bad Cluster Forgejo instance
# (git.badcluster.dev). Forgejo-only; there is no GitHub equivalent.
#
# actions/* are pinned to https://git.badcluster.dev/actions/... (this
# instance's own pull-mirrors) rather than the bare `owner/repo` shorthand,
# which would resolve against data.forgejo.org.
#
# No `pull_request` trigger, matching the policy settled on for ZephyrFTP
# and ipscanner: a stranger's PR code must not run on persistent
# self-hosted hardware.
#
# The runners are bare, persistent machines (no preinstalled images), so
# each job bootstraps Rust through rustup idempotently: only a fresh machine
# pays for the download, and `rustup toolchain install` is a no-op once the
# toolchain is current. ~/.cargo is shared across runs, so crates.io
# downloads and compiled dependencies are reused.
#
# A `v*` tag matching the Cargo.toml version also publishes a Forgejo
# prerelease with every platform package (Linux tarball, AppImage, .deb and
# .rpm; Windows installer and zip; macOS disk image), once every build passes.
#
# Persistent workspaces also mean target/ survives between runs. Cargo's
# freshness check is mtime-based, so before the release build each job
# cleans this workspace's own crates (not the dependencies) so a stale
# object can never end up in an uploaded artifact.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'

jobs:
  linux:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Bootstrap Rust toolchain
        run: |
          set -e
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal -c clippy -c rustfmt
          "$HOME/.cargo/bin/rustup" default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # lrzsz's sz/rz are what most Unix BBSes run; the interop tests in
      # crates/badterm-core/tests/lrzsz.rs transfer files against them.
      # Three runner instances share one VM, so another job (or unattended-upgrades)
      # can hold apt's lock: on 2026-10-29 the v0.1.1 tag run failed with "Could not
      # get lock /var/lib/apt/lists/lock" while the main run was installing lrzsz.
      # Wait for the lock and retry, and stop as soon as sz exists either way.
      # C-Kermit, likewise, for crates/badterm-core/tests/kermit.rs.
      - name: Install lrzsz and C-Kermit
        run: |
          command -v sz >/dev/null && command -v kermit >/dev/null && exit 0
          for i in $(seq 1 30); do
            sudo apt-get -o DPkg::Lock::Timeout=60 update -qq \
              && sudo apt-get -o DPkg::Lock::Timeout=60 install -y -qq lrzsz ckermit && exit 0
            command -v sz >/dev/null && command -v kermit >/dev/null && exit 0
            echo "apt busy (attempt $i/30), retrying in 10s"
            sleep 10
          done
          exit 1

      - uses: https://git.badcluster.dev/actions/checkout@v7

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # BADTERM_REQUIRE_LRZSZ and _KERMIT turn a missing sz/rz or kermit into
      # a failure instead of a skipped test, so interop can't silently stop
      # being checked.
      - name: Test
        env:
          BADTERM_REQUIRE_LRZSZ: '1'
          BADTERM_REQUIRE_KERMIT: '1'
        run: cargo test --locked

      # Against glibc 2.28 (cargo-zigbuild), not the runner's own, which is
      # far newer (2.43): a package built against that would not install
      # on Ubuntu 24.04 or Debian 13.
      - name: Release build
        run: |
          cargo clean --release --target x86_64-unknown-linux-gnu -p badterm -p badterm-core
          packaging/linux/build-release.sh

      - name: Test the move from Phosphor's folders
        run: packaging/test-folder-upgrade.sh target/x86_64-unknown-linux-gnu/release/badterm

      # Named after the ref: the version tag for releases, the branch otherwise.
      # A tarball (with the desktop file and icon, for installing by hand), an
      # AppImage, and .deb and .rpm packages. The scripts pin and checksum the
      # tools they fetch.
      - name: Package
        run: |
          set -e
          name="badterm-${GITHUB_REF_NAME}-linux-x64"
          rm -rf dist && mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-gnu/release/badterm README.md LICENSE packaging/linux/badterm.desktop "dist/$name/"
          cp crates/badterm/assets/icon/badterm-256.png "dist/$name/badterm.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          packaging/linux/build-appimage.sh target/x86_64-unknown-linux-gnu/release/badterm "${GITHUB_REF_NAME#v}" "dist/$name.AppImage"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          packaging/linux/build-packages.sh target/x86_64-unknown-linux-gnu/release/badterm "$version" "dist/$name"
          dpkg-deb --info "dist/$name.deb"
          dpkg-deb --contents "dist/$name.deb"

      - name: Upload package
        uses: https://git.badcluster.dev/actions/upload-artifact@v3
        with:
          name: badterm-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    runs-on: [self-hosted, Windows]
    steps:
      # Same approach as ipscanner's build-windows bootstrap: winget with
      # --source winget pinned (msstore queries fail on this box), then PATH
      # re-read from the registry and pushed into GITHUB_PATH. Rust's MSVC
      # target needs the VS Build Tools C++ workload for link.exe; rustc
      # locates it on its own, so it does not need to be on PATH.
      - name: Bootstrap toolchain (VS Build Tools, rustup)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function EnsureWinget($id, $overrideArgs) {
            winget list --id $id -e --source winget | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Installing $id..."
              $wingetArgs = @('install', '--id', $id, '-e', '--source', 'winget', '--silent',
                              '--accept-package-agreements', '--accept-source-agreements')
              if ($overrideArgs) { $wingetArgs += @('--override', $overrideArgs) }
              winget @wingetArgs
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::winget install failed for $id (exit $LASTEXITCODE)"; exit 1 }
            } else {
              Write-Host "$id already installed, skipping."
            }
          }

          EnsureWinget "Microsoft.VisualStudio.2022.BuildTools" "--quiet --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
          EnsureWinget "Rustlang.Rustup" $null
          # Builds the installer (free for non-commercial use, as here).
          EnsureWinget "JRSoftware.InnoSetup" $null

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
          $env:PATH = "$cargoBin;$machinePath;$userPath"

          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal -c clippy -c rustfmt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - uses: https://git.badcluster.dev/actions/checkout@v7

      - name: Clippy
        shell: powershell
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test
        shell: powershell
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Release build
        shell: powershell
        run: |
          cargo clean --release -p badterm -p badterm-core
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Passwords saved by Phosphor (up to 0.1.16) move to BadTerm's name in
      # the Credential Manager.
      - name: Test the move from Phosphor's passwords
        shell: powershell
        run: |
          cargo test --locked -p badterm keychain -- --ignored
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Phosphor's folders under %APPDATA% move to BadTerm's on first start.
      # These are the runner's real folders: only ones holding this test's
      # marker are touched.
      - name: Test the move from Phosphor's folders
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = 'ci-upgrade-marker'
          $old = Join-Path $env:APPDATA 'Phosphor\Phosphor'
          $new = Join-Path $env:APPDATA 'Bad Cluster\BadTerm'
          foreach ($d in $old, $new) {
            if (Test-Path $d) {
              if (Test-Path "$d\config\$marker") { Remove-Item -Recurse -Force $d }
              else { Write-Host "::warning::$d exists and is not this test's; skipping"; exit 0 }
            }
          }
          New-Item -ItemType Directory -Force "$old\config", "$old\data\captures" | Out-Null
          Set-Content "$old\config\$marker" 'from Phosphor'
          $p = Start-Process -Wait -PassThru -NoNewWindow target\release\badterm.exe -ArgumentList '--paths'
          $fail = $p.ExitCode -ne 0
          if (-not (Test-Path "$new\config\$marker")) { Write-Host "::error::settings were not moved to $new\config"; $fail = $true }
          if (-not (Test-Path "$new\data\captures")) { Write-Host "::error::captures were not moved to $new\data"; $fail = $true }
          if (Test-Path "$old\config") { Write-Host "::error::$old\config is still there"; $fail = $true }
          Remove-Item -Recurse -Force $new, (Join-Path $env:APPDATA 'Phosphor') -ErrorAction SilentlyContinue
          if ($fail) { exit 1 }
          Write-Host "Phosphor's folders moved to BadTerm's"

      - name: Package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "badterm-$env:GITHUB_REF_NAME-windows-x64"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path "dist\$name" | Out-Null
          Copy-Item target\release\badterm.exe, README.md, LICENSE -Destination "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"

          # The installer. Its version is the crate's, since a branch name
          # is not a version number.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Host "::error::ISCC.exe not found"; exit 1 }
          & $iscc /Qp "/DAppVersion=$version" "/DOutputName=$name-setup" packaging\windows\badterm.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Install Phosphor 0.1.16 (from before the rename) for this user into a
      # scratch folder, upgrade it with this installer, and check that
      # Phosphor's program, shortcuts and link registration are replaced by
      # BadTerm's. Then uninstall and check BadTerm is gone.
      - name: Test the installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "badterm-install-test"
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          $programs = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $desktop = [Environment]::GetFolderPath('Desktop')

          $phosphor = Join-Path $env:RUNNER_TEMP 'phosphor-v0.1.16-windows-x64-setup.exe'
          if (-not (Test-Path $phosphor)) {
            Invoke-WebRequest -UseBasicParsing -UserAgent 'badterm-ci' -OutFile $phosphor `
              -Uri 'https://git.badcluster.dev/arelas/badterm/releases/download/v0.1.16/phosphor-v0.1.16-windows-x64-setup.exe'
          }
          $p = Start-Process -Wait -PassThru $phosphor -ArgumentList ($quiet + '/TASKS=links,desktopicon')
          if ($p.ExitCode -ne 0) { Write-Host "::error::Phosphor's setup exited with $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\phosphor.exe")) { Write-Host "::error::Phosphor 0.1.16 not installed"; exit 1 }
          if (-not (Test-Path 'HKCU:\Software\Classes\Phosphor.URL')) { Write-Host "::error::Phosphor's links not registered"; exit 1 }

          $p = Start-Process -Wait -PassThru $setup.FullName -ArgumentList ($quiet + '/TASKS=links')
          if ($p.ExitCode -ne 0) { Write-Host "::error::setup exited with $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\badterm.exe")) { Write-Host "::error::badterm.exe not installed"; exit 1 }
          $fail = $false
          foreach ($left in "$dir\phosphor.exe", "$programs\Phosphor.lnk", "$desktop\Phosphor.lnk",
                            'HKCU:\Software\Classes\Phosphor.URL', 'HKCU:\Software\Phosphor') {
            if (Test-Path $left) { Write-Host "::error::left over from Phosphor: $left"; $fail = $true }
          }
          if ((Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue).Phosphor) {
            Write-Host "::error::Phosphor still in RegisteredApplications"; $fail = $true
          }
          if (-not (Test-Path "$programs\BadTerm.lnk")) { Write-Host "::error::no BadTerm shortcut"; $fail = $true }
          if (-not (Test-Path 'HKCU:\Software\Classes\BadTerm.URL')) { Write-Host "::error::BadTerm's links not registered"; $fail = $true }
          if ($fail) { exit 1 }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\telnet\shell\open\command').'(default)'
          Write-Host "telnet:// opens: $cmd"
          if ($cmd -notlike "*$dir\badterm.exe*") { Write-Host "::error::telnet:// handler not registered"; exit 1 }
          $p = Start-Process -Wait -PassThru "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { Write-Host "::error::uninstall exited with $($p.ExitCode)"; exit 1 }
          # The uninstaller removes itself a moment after exiting.
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\badterm.exe") { Write-Host "::error::badterm.exe left behind"; exit 1 }
          if (Test-Path 'HKCU:\Software\Classes\telnet\shell\open\command') { Write-Host "::error::handler left behind"; exit 1 }

      - name: Upload package
        uses: https://git.badcluster.dev/actions/upload-artifact@v3
        with:
          name: badterm-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Bootstrap Rust toolchain
        run: |
          set -e
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal -c clippy -c rustfmt
          "$HOME/.cargo/bin/rustup" default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Optional here: the lrzsz interop tests run if Homebrew provides it
      # and skip otherwise; Linux is where they are required.
      - name: Install lrzsz (best effort)
        run: command -v sz >/dev/null || brew install lrzsz || echo "lrzsz unavailable; interop tests will skip"

      - uses: https://git.badcluster.dev/actions/checkout@v7

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: |
          cargo clean --release -p badterm -p badterm-core
          cargo build --release --locked

      # Passwords saved by Phosphor (up to 0.1.16) move to BadTerm's name in
      # the login keychain.
      - name: Test the move from Phosphor's passwords
        run: cargo test --locked -p badterm keychain -- --ignored

      - name: Test the move from Phosphor's folders
        run: packaging/test-folder-upgrade.sh target/release/badterm

      # BadTerm.app in a disk image. Architecture from the runner itself
      # rather than assumed.
      - name: Package
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          packaging/macos/build-dmg.sh target/release/badterm "${GITHUB_REF_NAME#v}" \
            "dist/badterm-${GITHUB_REF_NAME}-macos-$(uname -m).dmg"

      - name: Upload package
        uses: https://git.badcluster.dev/actions/upload-artifact@v3
        with:
          name: badterm-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    # Gated on every platform: a release missing one platform's package must
    # not be published looking complete.
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux]
    steps:
      - uses: https://git.badcluster.dev/actions/checkout@v7

      - name: Check the tag matches the crate version
        run: |
          set -e
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: https://git.badcluster.dev/actions/download-artifact@v3
        with:
          name: badterm-linux-x64
          path: dist/release
      - uses: https://git.badcluster.dev/actions/download-artifact@v3
        with:
          name: badterm-windows-x64
          path: dist/release
      - uses: https://git.badcluster.dev/actions/download-artifact@v3
        with:
          name: badterm-macos
          path: dist/release

      - name: Verify every expected asset is present
        run: |
          ls -la dist/release
          fail=0
          for pattern in "*-linux-x64.tar.gz" "*-linux-x64.AppImage" "*-linux-x64.deb" "*-linux-x64.rpm" \
                         "*-windows-x64.zip" "*-windows-x64-setup.exe" "*-macos-*.dmg"; do
            n=$(ls dist/release/$pattern 2>/dev/null | wc -l)
            if [ "$n" -eq 0 ]; then echo "MISSING ASSET: $pattern"; fail=1;
            else echo "ok: $pattern -> $(ls dist/release/$pattern)"; fi
          done
          [ "$fail" -eq 0 ] || exit 1
          (cd dist/release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      # No `token:`, as in ipscanner: Forgejo Actions injects a
      # repository-scoped token that the action picks up itself.
      #
      # prerelease: pre-1.0, and the macOS binary is unsigned.
      - name: Create Forgejo release
        uses: actions/forgejo-release@v2.6.2
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          release-dir: dist/release
          prerelease: true
          repo: ${{ github.repository }}
          sha: ${{ github.sha }}
          release-notes-assistant: ''

      # badterm.com, from site/deploy.py, which stamps the download links
      # from the release just made. SITE_DEPLOY_KEY can only rsync into
      # /var/www/badterm on oracle1 (rrsync in its authorized_keys), so the
      # destination is that folder's root.
      - name: Publish the website
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          set -e
          command -v rsync >/dev/null || sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq rsync
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SITE_DEPLOY_KEY" > "$ssh_dir/key"
          echo 'oracle1.badcluster.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJJ08VfdW8Vgx8oSsD2kptTc5f/Cub+x8VsXqcOOMXgF' > "$ssh_dir/known_hosts"
          export RSYNC_RSH="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          BADTERM_SITE_DEST=ubuntu@oracle1.badcluster.dev: python3 -I site/deploy.py
