name: CI

# Canonical CI for BadTerm, on the Bad Cluster Forgejo instance
# (git.badcluster.dev). Forgejo-only; there is no GitHub equivalent.
#
# actions/* are pinned to https://git.badcluster.dev/actions/... (this
# instance's own pull-mirrors) rather than the bare `owner/repo` shorthand,
# which would resolve against data.forgejo.org.
#
# No `pull_request` trigger, matching the policy settled on for ZephyrFTP
# and ipscanner: a stranger's PR code must not run on persistent
# self-hosted hardware.
#
# The runners are bare, persistent machines (no preinstalled images), so
# each job bootstraps Rust through rustup idempotently: only a fresh machine
# pays for the download, and `rustup toolchain install` is a no-op once the
# toolchain is current. ~/.cargo is shared across runs, so crates.io
# downloads and compiled dependencies are reused.
#
# A `v*` tag matching the Cargo.toml version also publishes a Forgejo
# prerelease with every platform package (Linux tarball, AppImage, .deb and
# .rpm; Windows installer and zip; macOS disk image), once every build passes.
#
# The runner gives each job a new workspace folder (.cache/act/<id>/), so
# target/ there never survives. CARGO_TARGET_DIR points every job at one
# build folder per machine instead (~/.cache/badterm-target), where the
# compiled dependencies stay between runs; before 0.3.2 every run built
# all ~260 crates three times (clippy, tests, release). BadTerm's own two
# crates rebuild each run anyway (the workspace path is part of their
# fingerprint), so each job first clears their old builds by name, keeping
# the folder from growing; a size guard wipes it should it pass 30 GB. The
# release binaries are copied back into the workspace's target/, where the
# packaging steps look for them.
#
# The release commit ("Release x.y.z" on main) isn't built on its own: the
# tag pushed right after it runs everything on the same commit.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  # Line numbers for backtraces, without full debug info: smaller test
  # binaries, linked faster (most of all on Windows).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: [self-hosted, Linux]
    steps:
      - name: Bootstrap Rust toolchain
        run: |
          set -e
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal -c clippy -c rustfmt
          "$HOME/.cargo/bin/rustup" default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Use the machine's build folder
        run: |
          set -e
          dir="$HOME/.cache/badterm-target"
          mkdir -p "$dir"
          if [ "$(du -sk "$dir" | cut -f1)" -gt 31457280 ]; then
            echo "Build folder over 30 GB: starting it afresh"
            rm -rf "$dir" && mkdir -p "$dir"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # lrzsz's sz/rz are what most Unix BBSes run; the interop tests in
      # crates/badterm-core/tests/lrzsz.rs transfer files against them.
      # Three runner instances share one VM, so another job (or unattended-upgrades)
      # can hold apt's lock: on 2026-10-29 the v0.1.1 tag run failed with "Could not
      # get lock /var/lib/apt/lists/lock" while the main run was installing lrzsz.
      # Wait for the lock and retry, and stop as soon as sz exists either way.
      # C-Kermit, likewise, for crates/badterm-core/tests/kermit.rs.
      - name: Install lrzsz and C-Kermit
        run: |
          command -v sz >/dev/null && command -v kermit >/dev/null && exit 0
          for i in $(seq 1 30); do
            sudo apt-get -o DPkg::Lock::Timeout=60 update -qq \
              && sudo apt-get -o DPkg::Lock::Timeout=60 install -y -qq lrzsz ckermit && exit 0
            command -v sz >/dev/null && command -v kermit >/dev/null && exit 0
            echo "apt busy (attempt $i/30), retrying in 10s"
            sleep 10
          done
          exit 1

      - uses: https://git.badcluster.dev/actions/checkout@v7

      # Earlier runs' builds of BadTerm's own crates (by name; they're
      # rebuilt each run): the dependencies stay.
      - name: Clear old builds of BadTerm's crates
        run: |
          cargo clean -p badterm -p badterm-core
          cargo clean --release -p badterm -p badterm-core

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # BADTERM_REQUIRE_LRZSZ and _KERMIT turn a missing sz/rz or kermit into
      # a failure instead of a skipped test, so interop can't silently stop
      # being checked.
      - name: Test
        env:
          BADTERM_REQUIRE_LRZSZ: '1'
          BADTERM_REQUIRE_KERMIT: '1'
        run: cargo test --locked

      # Against glibc 2.28 (cargo-zigbuild), not the runner's own, which is
      # far newer (2.43): a package built against that would not install
      # on Ubuntu 24.04 or Debian 13.
      - name: Release build
        run: |
          # zig's linker opens every object file at once, and there are
          # more than the default 1024 now.
          ulimit -n "$(ulimit -Hn)" || ulimit -n 65536 || true
          cargo clean --release --target x86_64-unknown-linux-gnu -p badterm -p badterm-core
          packaging/linux/build-release.sh
          mkdir -p target/x86_64-unknown-linux-gnu/release
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/badterm" target/x86_64-unknown-linux-gnu/release/

      # Named after the ref: the version tag for releases, the branch otherwise.
      # A tarball (with the desktop file and icon, for installing by hand), an
      # AppImage, and .deb and .rpm packages. The scripts pin and checksum the
      # tools they fetch.
      - name: Package
        run: |
          set -e
          name="badterm-${GITHUB_REF_NAME}-linux-x64"
          rm -rf dist && mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-gnu/release/badterm README.md LICENSE packaging/linux/badterm.desktop "dist/$name/"
          cp crates/badterm/assets/icon/badterm-256.png "dist/$name/badterm.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          packaging/linux/build-appimage.sh target/x86_64-unknown-linux-gnu/release/badterm "${GITHUB_REF_NAME#v}" "dist/$name.AppImage"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          packaging/linux/build-packages.sh target/x86_64-unknown-linux-gnu/release/badterm "$version" "dist/$name"
          dpkg-deb --info "dist/$name.deb"
          dpkg-deb --contents "dist/$name.deb"

      - name: Upload package
        uses: https://git.badcluster.dev/actions/upload-artifact@v3
        with:
          name: badterm-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: [self-hosted, Windows]
    steps:
      # Same approach as ipscanner's build-windows bootstrap: winget with
      # --source winget pinned (msstore queries fail on this box), then PATH
      # re-read from the registry and pushed into GITHUB_PATH. Rust's MSVC
      # target needs the VS Build Tools C++ workload for link.exe; rustc
      # locates it on its own, so it does not need to be on PATH.
      - name: Bootstrap toolchain (VS Build Tools, rustup)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function EnsureWinget($id, $overrideArgs) {
            winget list --id $id -e --source winget | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Installing $id..."
              $wingetArgs = @('install', '--id', $id, '-e', '--source', 'winget', '--silent',
                              '--accept-package-agreements', '--accept-source-agreements')
              if ($overrideArgs) { $wingetArgs += @('--override', $overrideArgs) }
              winget @wingetArgs
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::winget install failed for $id (exit $LASTEXITCODE)"; exit 1 }
            } else {
              Write-Host "$id already installed, skipping."
            }
          }

          EnsureWinget "Microsoft.VisualStudio.2022.BuildTools" "--quiet --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
          EnsureWinget "Rustlang.Rustup" $null
          # Builds the installer (free for non-commercial use, as here).
          EnsureWinget "JRSoftware.InnoSetup" $null

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
          $env:PATH = "$cargoBin;$machinePath;$userPath"

          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal -c clippy -c rustfmt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      # A build folder that outlives the job (see the notes at the top). A
      # count of runs stands in for its size, which is slow to add up here.
      - name: Use the machine's build folder
        shell: powershell
        run: |
          $dir = Join-Path $env:USERPROFILE '.cache\badterm-target'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $count = Join-Path $dir 'runs.txt'
          $runs = 0
          if (Test-Path $count) { $runs = [int](Get-Content $count) }
          if ($runs -ge 40) {
            Write-Host "Build folder used 40 times: starting it afresh"
            Remove-Item -Recurse -Force $dir
            New-Item -ItemType Directory -Force $dir | Out-Null
            $runs = 0
          }
          Set-Content $count ($runs + 1)
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$dir"

      - uses: https://git.badcluster.dev/actions/checkout@v7

      - name: Clear old builds of BadTerm's crates
        shell: powershell
        run: |
          cargo clean -p badterm -p badterm-core
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clean --release -p badterm -p badterm-core
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Clippy
        shell: powershell
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test
        shell: powershell
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Release build
        shell: powershell
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR 'release\badterm.exe') target\release\

      # Saving, reading and deleting a password in the Credential Manager.
      - name: Test the OS keychain
        shell: powershell
        run: |
          cargo test --locked -p badterm keychain -- --ignored
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Azure Artifact Signing (Authenticode), as ZephyrFTP does: see
      # packaging/windows/sign.ps1, and the AZURE_* secrets on the arelas
      # account. Before packaging, so the zip and the installer both carry
      # the signed program. A v* tag MUST be signed: missing secrets fail
      # the release rather than quietly shipping unsigned files.
      - name: Sign badterm.exe
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_SIGNING_ACCOUNT) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              Write-Host "::error::a release must be signed: AZURE_SIGNING_ACCOUNT is not set"
              exit 1
            }
            Write-Host "::warning::Azure Artifact Signing secrets not set - badterm.exe ships UNSIGNED"
            exit 0
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\sign.ps1 target\release\badterm.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "badterm-$env:GITHUB_REF_NAME-windows-x64"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path "dist\$name" | Out-Null
          Copy-Item target\release\badterm.exe, README.md, LICENSE -Destination "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"

          # The installer. Its version is the crate's, since a branch name
          # is not a version number.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Host "::error::ISCC.exe not found"; exit 1 }
          & $iscc /Qp "/DAppVersion=$version" "/DOutputName=$name-setup" packaging\windows\badterm.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Before the install test below, so that tests the file that ships.
      # (Its uninstaller, which Inno Setup builds inside it, stays unsigned.)
      - name: Sign the installer
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_SIGNING_ACCOUNT) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              Write-Host "::error::a release must be signed: AZURE_SIGNING_ACCOUNT is not set"
              exit 1
            }
            Write-Host "::warning::Azure Artifact Signing secrets not set - the installer ships UNSIGNED"
            exit 0
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\sign.ps1 (Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Install for this user into a scratch folder, check the program,
      # shortcut and link registration are there, then uninstall and check
      # they're gone.
      - name: Test the installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "badterm-install-test"
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          $programs = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'

          $p = Start-Process -Wait -PassThru $setup.FullName -ArgumentList ($quiet + '/TASKS=links')
          if ($p.ExitCode -ne 0) { Write-Host "::error::setup exited with $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\badterm.exe")) { Write-Host "::error::badterm.exe not installed"; exit 1 }
          $fail = $false
          if (-not (Test-Path "$programs\BadTerm.lnk")) { Write-Host "::error::no BadTerm shortcut"; $fail = $true }
          if (-not (Test-Path 'HKCU:\Software\Classes\BadTerm.URL')) { Write-Host "::error::BadTerm's links not registered"; $fail = $true }
          if ($fail) { exit 1 }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\telnet\shell\open\command').'(default)'
          Write-Host "telnet:// opens: $cmd"
          if ($cmd -notlike "*$dir\badterm.exe*") { Write-Host "::error::telnet:// handler not registered"; exit 1 }
          $p = Start-Process -Wait -PassThru "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { Write-Host "::error::uninstall exited with $($p.ExitCode)"; exit 1 }
          # The uninstaller removes itself a moment after exiting.
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\badterm.exe") { Write-Host "::error::badterm.exe left behind"; exit 1 }
          if (Test-Path 'HKCU:\Software\Classes\telnet\shell\open\command') { Write-Host "::error::handler left behind"; exit 1 }

      - name: Upload package
        uses: https://git.badcluster.dev/actions/upload-artifact@v3
        with:
          name: badterm-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: [self-hosted, macOS]
    steps:
      - name: Bootstrap Rust toolchain
        run: |
          set -e
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal -c clippy -c rustfmt
          "$HOME/.cargo/bin/rustup" default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Use the machine's build folder
        run: |
          set -e
          dir="$HOME/.cache/badterm-target"
          mkdir -p "$dir"
          if [ "$(du -sk "$dir" | cut -f1)" -gt 31457280 ]; then
            echo "Build folder over 30 GB: starting it afresh"
            rm -rf "$dir" && mkdir -p "$dir"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # Optional here: the lrzsz interop tests run if Homebrew provides it
      # and skip otherwise; Linux is where they are required.
      - name: Install lrzsz (best effort)
        run: command -v sz >/dev/null || brew install lrzsz || echo "lrzsz unavailable; interop tests will skip"

      - uses: https://git.badcluster.dev/actions/checkout@v7

      # Earlier runs' builds of BadTerm's own crates (by name; they're
      # rebuilt each run): the dependencies stay.
      - name: Clear old builds of BadTerm's crates
        run: |
          cargo clean -p badterm -p badterm-core
          cargo clean --release -p badterm -p badterm-core

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: |
          cargo build --release --locked
          mkdir -p target/release
          cp "$CARGO_TARGET_DIR/release/badterm" target/release/

      # Saving, reading and deleting a password in the login keychain.
      - name: Test the OS keychain
        run: cargo test --locked -p badterm keychain -- --ignored

      # Developer ID signing, the same way as ZephyrFTP and with the same
      # account-level secrets: the certificate only ever lives in a keychain
      # made for this job and deleted at its end (the runner is a persistent
      # machine), which also never needs to prompt. A v* tag MUST be signed
      # and notarized: missing secrets fail the release. Other runs sign if
      # they can, and never notarize.
      - name: Set up signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -e
          is_release=false
          case "$GITHUB_REF" in refs/tags/v*) is_release=true ;; esac
          if [ -z "$MACOS_CERT_P12" ]; then
            if $is_release; then
              echo "::error::a release must be Developer ID signed: MACOS_CERT_P12 is not set"
              exit 1
            fi
            echo "No signing certificate: the app keeps its ad-hoc signature"
            exit 0
          fi

          umask 077
          tmp=$(mktemp -d)
          kc="$tmp/badterm-signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          # Remembered so the cleanup step can restore the search list.
          security list-keychains -d user | tr -d '"' | xargs > "$tmp/old-keychains"
          echo "SIGN_TMP=$tmp" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          # Apple's Developer ID intermediates, which codesign needs to
          # build the chain and a Mac doesn't always have.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl --proto '=https' --tlsv1.2 -sSfLo "$tmp/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$tmp/$ca.cer" -k "$kc" >/dev/null || true
          done
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$tmp/cert.p12"
          security import "$tmp/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$tmp/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(cat "$tmp/old-keychains")
          identity=$(security find-identity -v -p codesigning "$kc" \
            | awk -v team="($APPLE_TEAM_ID)" '/Developer ID Application/ && index($0, team) { print $2; exit }')
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error::no Developer ID Application identity for team $APPLE_TEAM_ID in MACOS_CERT_P12"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          if $is_release; then
            if [ -z "$NOTARY_KEY_P8" ]; then
              echo "::error::a release must be notarized: NOTARY_KEY_P8 is not set"
              exit 1
            fi
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$tmp/notary.p8"
            echo "NOTARY_KEY_FILE=$tmp/notary.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
          else
            echo "Not a release tag: signed, not notarized"
          fi

      # BadTerm.app in a disk image: signed with the Developer ID and, for a
      # release, notarized (see build-dmg.sh). Architecture from the runner
      # itself rather than assumed.
      - name: Package
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          packaging/macos/build-dmg.sh target/release/badterm "${GITHUB_REF_NAME#v}" \
            "dist/badterm-${GITHUB_REF_NAME}-macos-$(uname -m).dmg"

      - name: Upload package
        uses: https://git.badcluster.dev/actions/upload-artifact@v3
        with:
          name: badterm-macos
          path: dist/*.dmg
          if-no-files-found: error

      # always(): runs even when a step above failed, so the certificate
      # and notary key never outlive the job on this persistent runner.
      - name: Remove signing keychain
        if: always() && env.SIGN_TMP != ''
        run: |
          # shellcheck disable=SC2046
          security list-keychains -d user -s $(cat "$SIGN_TMP/old-keychains") || true
          security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true
          rm -rf "$SIGN_TMP"

  release:
    # Gated on every platform: a release missing one platform's package must
    # not be published looking complete.
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux]
    steps:
      - uses: https://git.badcluster.dev/actions/checkout@v7

      - name: Check the tag matches the crate version
        run: |
          set -e
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: https://git.badcluster.dev/actions/download-artifact@v3
        with:
          name: badterm-linux-x64
          path: dist/release
      - uses: https://git.badcluster.dev/actions/download-artifact@v3
        with:
          name: badterm-windows-x64
          path: dist/release
      - uses: https://git.badcluster.dev/actions/download-artifact@v3
        with:
          name: badterm-macos
          path: dist/release

      - name: Verify every expected asset is present
        run: |
          ls -la dist/release
          fail=0
          for pattern in "*-linux-x64.tar.gz" "*-linux-x64.AppImage" "*-linux-x64.deb" "*-linux-x64.rpm" \
                         "*-windows-x64.zip" "*-windows-x64-setup.exe" "*-macos-*.dmg"; do
            n=$(ls dist/release/$pattern 2>/dev/null | wc -l)
            if [ "$n" -eq 0 ]; then echo "MISSING ASSET: $pattern"; fail=1;
            else echo "ok: $pattern -> $(ls dist/release/$pattern)"; fi
          done
          [ "$fail" -eq 0 ] || exit 1
          (cd dist/release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      # No `token:`, as in ipscanner: Forgejo Actions injects a
      # repository-scoped token that the action picks up itself.
      #
      # prerelease: pre-1.0.
      - name: Create Forgejo release
        uses: actions/forgejo-release@v2.6.2
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          release-dir: dist/release
          prerelease: true
          repo: ${{ github.repository }}
          sha: ${{ github.sha }}
          release-notes-assistant: ''

      # badterm.com, from site/deploy.py, which stamps the download links
      # from the release just made. SITE_DEPLOY_KEY can only rsync into
      # /var/www/badterm on oracle1 (rrsync in its authorized_keys), so the
      # destination is that folder's root.
      - name: Publish the website
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          set -e
          command -v rsync >/dev/null || sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq rsync
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SITE_DEPLOY_KEY" > "$ssh_dir/key"
          echo 'oracle1.badcluster.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJJ08VfdW8Vgx8oSsD2kptTc5f/Cub+x8VsXqcOOMXgF' > "$ssh_dir/known_hosts"
          export RSYNC_RSH="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          BADTERM_SITE_DEST=ubuntu@oracle1.badcluster.dev: python3 -I site/deploy.py
