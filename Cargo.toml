[workspace]
resolver = "3"
members = ["crates/phosphor-core", "crates/phosphor"]

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Bad Cluster"]
repository = "https://git.badcluster.dev/arelas/phosphor"
rust-version = "1.89"

[workspace.dependencies]
phosphor-core = { path = "crates/phosphor-core" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
csv = "1.4"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util"] }
# Telnet over TLS, on the same ring crypto as SSH.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
ring = "0.17"
zmodem2 = "0.7"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
directories = "6.0"
winit = "0.30.13"
softbuffer = "0.4.8"
arboard = { version = "3.7", default-features = false }
# Keychain (macOS), Credential Manager (Windows), Secret Service over zbus (Linux, pure Rust).
keyring = "4.2"

[profile.release]
lto = "thin"
