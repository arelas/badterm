[workspace]
resolver = "3"
members = ["crates/badterm-core", "crates/badterm"]

[workspace.package]
version = "0.4.8"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Bad Cluster"]
repository = "https://git.badcluster.dev/arelas/badterm"
homepage = "https://badterm.com/"
readme = "README.md"
keywords = ["bbs", "telnet", "ansi", "terminal", "zmodem"]
rust-version = "1.89"

[workspace.dependencies]
badterm-core = { path = "crates/badterm-core", version = "0.4.8" }
rhai = "1.27"
ym2149 = { version = "0.9.1", default-features = false, features = ["emulator"] }
ym2149-gist-replayer = "0.9.1"
chrono = { version = "0.4.40", default-features = false, features = ["clock", "std"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
csv = "1.4"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util"] }
# Telnet over TLS, on the same ring crypto as SSH.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
ring = "0.17"
zmodem2 = "0.7"
# Modems. Without libudev, so the Linux build needs nothing beyond glibc;
# the port list then comes from /sys.
serialport = { version = "4.10", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
directories = "6.0"
winit = "0.30.13"
softbuffer = "0.4.8"
arboard = { version = "3.7", default-features = false }
# Keychain (macOS), Credential Manager (Windows), Secret Service over zbus (Linux, pure Rust).
keyring = "4.2"
# SyncTERM's graphics: JPEG XL pictures (pure Rust), base64 blobs, and
# the MD5 sums of cached files.
jxl-oxide = { version = "0.12.6", default-features = false }
data-encoding = "2.11"
md5 = "0.8"
# SyncTERM's audio: Ogg Opus music (pure Rust; matches the RFC 8251
# reference decoder to 5e-5 in our tests, and is quick).
ogg = "0.9.2"
rusty-opus = "1.0.2"
# And FLAC and Ogg Vorbis (pure Rust), and MP3 (a safe, bit-exact port
# of minimp3).
claxon = "0.4.3"
lewton = "0.10.2"
nanomp3 = "0.2.0"

[profile.release]
lto = "thin"
