# nfpm configuration for BadTerm's .deb and .rpm. build-packages.sh stages
# the files under ${STAGE} and fills in the ${...} values.
name: badterm
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: Bad Cluster <noreply@badcluster.dev>
vendor: Bad Cluster
homepage: https://badterm.com/
license: GPL-3.0-or-later
# BadTerm was called Phosphor up to 0.1.16; this package takes its place.
replaces:
  - phosphor
conflicts:
  - phosphor
description: |-
  ANSI-BBS client for telnet, SSH and RLogin
  BadTerm connects to bulletin board systems over telnet, telnet over TLS,
  SSH and RLogin, and draws them with the IBM VGA fonts: iCE colors, ANSI
  music, ZMODEM transfers, a dialing directory and a CRT phosphor mode.

# The binary links only glibc; the windowing, keyboard and sound libraries
# are opened when needed, so they are recommendations.
overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC})
    recommends:
      - libxkbcommon-x11-0
      - libwayland-client0
      - libasound2t64 | libasound2
  rpm:
    depends:
      - glibc >= ${GLIBC}
    recommends:
      - libxkbcommon-x11
      - libwayland-client
      - alsa-lib

contents:
  - src: ${STAGE}/badterm
    dst: /usr/bin/badterm
    file_info:
      mode: 0755
  - src: ${STAGE}/badterm.desktop
    dst: /usr/share/applications/badterm.desktop
  - src: ${STAGE}/README.md
    dst: /usr/share/doc/badterm/README.md
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/badterm/copyright
    packager: deb
  - src: ${STAGE}/LICENSE
    dst: /usr/share/licenses/badterm/LICENSE
    packager: rpm
    type: license
  # build-packages.sh adds each icon here (just the files: the hicolor
  # directories belong to the icon theme), so this list stays last.
