<!DOCTYPE html>
<html lang="en">
<head>

      <p class="eyebrow vga"><span class="ramp" aria-hidden="true">░▒▓█</span> The guide</p>
      <h1 class="vga x4 doc-title"><span class="ice">BadTerm help</span></h1>

{{article}}
    </article>
  </div>

{{footer}}
